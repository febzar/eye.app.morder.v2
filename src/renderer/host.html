<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morderx Host</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-primary); }
    .host-box {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
      padding: 36px; width: 440px; display: flex; flex-direction: column; gap: 18px;
    }
    .host-logo { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .host-logo svg { width: 44px; height: 44px; color: var(--accent); }
    .host-logo h1 { font-size: 1.4rem; margin: 0; }
    .host-logo p  { font-size: 0.82rem; color: var(--text-muted); margin: 0; text-align: center; }
    .field label { display: block; font-size: 0.76rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: opacity .15s;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn svg { width: 16px; height: 16px; }
    #start-btn { background: var(--accent); color: #fff; }
    #stop-btn  { background: #e0464b; color: #fff; display: none; }
    .btn:hover { opacity: .88; }
    .status {
      text-align: center; font-size: 0.85rem; font-family: var(--font-mono);
      padding: 8px; border-radius: 8px; color: var(--text-muted);
    }
    .status.live       { color: var(--success); }
    .status.error      { color: #ff5f5f; }
    .status.connecting { color: var(--accent); }
    .meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); font-family: var(--font-mono); }
    .meta .val { color: var(--text-primary); font-weight: 600; }
    #preview { width: 100%; border-radius: 10px; background: #000; display: block; max-height: 200px; object-fit: contain; }
    #error { color: #ff5f5f; font-size: 0.82rem; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="host-box">
    <div class="host-logo">
      <svg viewBox="0 0 48 48" fill="none">
        <rect x="4" y="8" width="40" height="26" rx="4" stroke="currentColor" stroke-width="2"/>
        <path d="M16 42h16M24 34v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="32" cy="17" r="4" fill="currentColor" opacity=".5"/>
      </svg>
      <h1>Morderx Host</h1>
      <p>Bagikan layar mesin ini ke viewer di jaringan lokal.</p>
    </div>

    <div class="field">
      <label>Password (kosongkan jika tanpa password)</label>
      <input type="password" id="host-pass" class="input-field" placeholder="Password" autocomplete="off" />
    </div>

    <button class="btn" id="start-btn">
      <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 18h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Bagikan Layar
    </button>
    <button class="btn" id="stop-btn">
      <svg viewBox="0 0 20 20" fill="none"><rect x="5" y="5" width="10" height="10" rx="2" fill="currentColor"/></svg>
      Hentikan
    </button>

    <div id="error"></div>
    <div class="status idle" id="status">Siap. Klik "Bagikan Layar" untuk mulai.</div>

    <video id="preview" muted playsinline></video>

    <div class="meta">
      <span>Viewer terhubung</span>
      <span class="val" id="viewer-count">0</span>
    </div>
  </div>

  <script src="host.js"></script>
</body>
</html>
