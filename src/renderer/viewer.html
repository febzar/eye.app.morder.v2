<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Morderx - Desktop via Local Network" />
  <title>Morderx Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Viewer-specific overrides — no titlebar drag area */
    body { padding-top: 0; }
    .titlebar { position: relative; -webkit-app-region: no-drag; cursor: default; }
    .titlebar-drag { cursor: default; }

    /* Auth overlay */
    #auth-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: var(--bg-primary);
      display: flex; align-items: center; justify-content: center;
    }
    .auth-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 360px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .auth-logo {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      margin-bottom: 4px;
    }
    .auth-logo svg { width: 48px; height: 48px; color: var(--accent); }
    .auth-logo h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .auth-logo p  { font-size: 0.82rem; color: var(--text-muted); margin: 0; }
    .auth-field label {
      display: block; font-size: 0.78rem; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px;
    }
    #auth-btn {
      margin-top: 4px;
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: opacity .15s;
    }
    #auth-btn:hover { opacity: .85; }
    #auth-error {
      color: #ff5f5f; font-size: 0.82rem; text-align: center;
      display: none;
    }

    /* Viewer layout — full screen canvas */
    #viewer-wrap {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    .viewer-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .viewer-brand {
      display: flex; align-items: center; gap: 8px;
      font-weight: 600; font-size: 0.9rem;
    }
    .viewer-brand svg { width: 20px; height: 20px; color: var(--accent); }
    .viewer-stats {
      display: flex; gap: 16px;
      font-size: 0.78rem; color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .stat-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 10px;
      display: flex; gap: 6px; align-items: center;
    }
    .stat-pill span.label { color: var(--text-muted); }
    .stat-pill span.val   { color: var(--text-primary); font-weight: 500; }
    .connected-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem;
    }
    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); animation: pulse 2s infinite;
    }
    .viewer-actions { display: flex; gap: 8px; }
    .vbtn {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 12px;
      color: var(--text-secondary); font-size: 0.78rem; cursor: pointer;
      transition: all .15s; display: flex; align-items: center; gap: 6px;
    }
    .vbtn:hover { border-color: var(--accent); color: var(--accent); }
    .vbtn.active { background: color-mix(in srgb, var(--accent) 15%, transparent); border-color: var(--accent); color: var(--accent); }
    .vbtn svg { width: 14px; height: 14px; }

    #canvas-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #080a0e; overflow: hidden; position: relative;
    }
    #screen-video { display: block; max-width: 100%; max-height: 100%; cursor: crosshair; }

    /* Placeholder */
    #placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      color: var(--text-muted);
    }
    #placeholder svg { width: 72px; height: 72px; opacity: .25; }
    #placeholder p { margin: 0; font-size: 0.9rem; }
  </style>
</head>
<body>

<!-- ── AUTH OVERLAY ──────────────────────────────────────────────────────── -->
<div id="auth-overlay">
  <div class="auth-box">
    <div class="auth-logo">
      <svg viewBox="0 0 48 48" fill="none">
        <rect x="4" y="8" width="40" height="26" rx="4" stroke="currentColor" stroke-width="2"/>
        <path d="M16 42h16M24 34v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="32" cy="17" r="4" fill="currentColor" opacity=".5"/>
        <path d="M12 22l5-5 5 5 5-5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Morderx</h1>
      <p>Masukkan password untuk terhubung ke host</p>
    </div>

    <div class="auth-field">
      <label>Password</label>
      <div class="input-group">
        <input type="password" id="auth-pass" class="input-field" placeholder="Kosong jika tanpa password" autocomplete="off" />
        <button class="toggle-pass" id="auth-pass-toggle">
          <svg viewBox="0 0 20 20" fill="none"><path d="M1 10s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6z" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>
    </div>

    <div id="auth-error">❌ Password salah, coba lagi.</div>
    <button id="auth-btn">
      <svg viewBox="0 0 20 20" fill="none" style="width:16px;height:16px;display:inline;vertical-align:middle;margin-right:6px"><path d="M10 3l7 7-7 7M3 10h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Hubungkan
    </button>
  </div>
</div>

<!-- ── VIEWER ─────────────────────────────────────────────────────────────── -->
<div id="viewer-wrap">
  <div class="viewer-topbar">
    <div class="viewer-brand">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="16" cy="7" r="2" fill="currentColor" opacity=".6"/>
        <path d="M7 10l2.5-2.5L12 10l2.5-2.5L17 10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Morderx
    </div>

    <div class="viewer-stats">
      <div class="stat-pill"><span class="label">FPS</span><span class="val" id="st-fps">–</span></div>
      <div class="stat-pill"><span class="label">Ping</span><span class="val" id="st-ping">– ms</span></div>
      <div class="stat-pill"><span class="label">Host</span><span class="val" id="st-host">–</span></div>
    </div>

    <div class="viewer-actions">
      <div class="connected-badge">
        <div class="pulse-dot"></div>
        <span id="viewer-count">1 viewer</span>
      </div>
      <button class="vbtn active" id="btn-input-toggle" title="Toggle mouse/keyboard control">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 7l7-4 7 4v6l-7 4-7-4V7z" stroke="currentColor" stroke-width="1.4"/></svg>
        Kontrol Aktif
      </button>
      <button class="vbtn" id="btn-fullscreen" title="Fullscreen">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 8V3h5M17 8V3h-5M3 12v5h5M17 12v5h-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Fullscreen
      </button>
    </div>
  </div>

  <div id="canvas-wrap">
    <div id="placeholder">
      <svg viewBox="0 0 80 80" fill="none">
        <rect x="5" y="10" width="70" height="48" rx="6" stroke="currentColor" stroke-width="2"/>
        <circle cx="40" cy="34" r="12" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
        <path d="M36 34l3 3 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p>Menunggu frame dari host...</p>
    </div>
    <video id="screen-video" style="display:none;" autoplay playsinline muted></video>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toast-container"></div>

<script src="viewer.js"></script>
</body>
</html>
